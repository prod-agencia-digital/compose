  ## Secure Database routes
  - name: meta
    _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
    url: http://meta:8080/
    routes:
      - name: meta-all
        strip_path: true
        paths:
          - /pg/
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  ## Block access to /api/mcp
  - name: mcp-blocker
    _comment: 'Block direct access to /api/mcp'
    url: http://studio:3000/api/mcp
    routes:
      - name: mcp-blocker-route
        strip_path: true
        paths:
          - /api/mcp
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Access is forbidden."

  ## MCP endpoint - local access
  - name: mcp
    _comment: 'MCP: /mcp -> http://studio:3000/api/mcp (local access)'
    url: http://studio:3000/api/mcp
    routes:
      - name: mcp
        strip_path: true
        paths:
          - /mcp
    plugins:
      # Block access to /mcp by default
      - name: request-termination
        config:
          status_code: 403
          message: "Access is forbidden."
      # Enable local access (danger zone!)
      # 1. Comment out the 'request-termination' section above
      # 2. Uncomment the entire section below, including 'deny'
      # 3. Add your local IPs to the 'allow' list
      #- name: cors
      #- name: ip-restriction
      #  config:
      #    allow:
      #      - 127.0.0.1
      #      - ::1
      #    deny: []

  ## Dashboard (Studio) NAO publicado - catch all remaining routes
  # CraftLoop (AP27-B14, 2026-09-29): o Studio atras de basic-auth ficava alcancavel por qualquer
  # dominio que chega ao Kong, inclusive os dos fronts em `/hcgi/platform`, sem MFA e aberto a
  # tentativa de senha em massa. Ninguem opera por ele (migration e conferencia vao por
  # `docker exec ... psql` no host), entao a rota responde 403 a todos, no molde do `/mcp` acima.
  # O container `studio` continua de pe (o `kong` depende dele); numa emergencia, abre-se por
  # tunel SSH ao container, sem republicar. Reabrir aqui e decisao do owner, nao conserto.
  - name: dashboard
    _comment: 'Studio: /* -> 403 (nao publicado)'
    url: http://studio:3000/
    routes:
      - name: dashboard-all
        strip_path: true
        paths:
          - /
    plugins:
      - name: request-termination
        config:
          status_code: 403
          message: "Access is forbidden."
