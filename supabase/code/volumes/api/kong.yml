_format_version: '2.1'
_transform: true

###
### Consumers / Users
###
consumers:
  - username: DASHBOARD
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
      - key: $SUPABASE_PUBLISHABLE_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY
      - key: $SUPABASE_SECRET_KEY
  # CraftLoop (Fase 2 do rate limit no Kong, 2026-10-15): a API do app, que chama o rest COMO o usuario
  # (o Bearer dele no Authorization) e nao pode cair nos limites por sessao e por IP do `anon` (a API sai de
  # um IP so, e muda de IP a cada deploy). Credencial NAO-JWT, so no `apikey`, e o grupo dela so entra no
  # `rest-v1`. A chave vem da env do compose; vazia, o kong-entrypoint.sh poe uma aleatoria no lugar.
  - username: api_server
    keyauth_credentials:
      - key: $SUPABASE_GATEWAY_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin
  - consumer: api_server
    group: api_server

###
### Rate limiting (CraftLoop, Fase 2, 2026-10-15)
###
# So contra ABUSO (decisao 287 do CraftLoop: «Não pode ser muito baixo. Temos clientes enterprise [...]
# Somente contra abuso mesmo.»). Uma instancia do plugin por pedido, pela precedencia do Kong: no `rest-v1`
# vale so a por SESSAO (consumidor + servico vence consumidor sozinho); nos outros servicos com chave
# (`auth-v1`, `graphql-v1`, `realtime-v1-*`), a por IP. O storage nao tem key-auth e fica fora.
# Os numeros e a conta estao no canonico do CraftLoop (.memory/pendencias.md, item do rate limit no Kong).
# 🚑 Para RELAXAR: mudar o numero aqui e `docker restart` no Kong do ambiente (o entrypoint renderiza o
# arquivo no start); depois o mesmo numero no fork, senao o proximo Deploy daquele ambiente reverte.
plugins:
  # Por SESSAO no rest: o `pre-function` do `rest-v1` poe o `session_id` do token em `X-CL-RL-Session`.
  # Sem sessao (sem token, ou token sem `session_id`), o Kong conta pelo IP real, com os mesmos numeros.
  # Pico medido de uma sessao (R6, 15/10): 42/s e 163/min; o teto e ~12x. Sem teto por hora: a janela e
  # fixa, e quem batesse nela ficaria bloqueado ate a virada.
  - name: rate-limiting
    service: rest-v1
    consumer: anon
    config:
      second: 500
      minute: 2000
      limit_by: header
      header_name: X-CL-RL-Session
      policy: local
      fault_tolerant: true
      hide_client_headers: false
  # Por IP real nos outros servicos com chave (inclui o `/token`): 2.000 pessoas atras de um IP, 100%
  # ativas no mesmo minuto, a 5/min fora do rest (o pico medido), com 3x de folga. Um 429 na renovacao do
  # token desloga a pessoa (o auth-js apaga a sessao), e por isso o teto e largo.
  - name: rate-limiting
    consumer: anon
    config:
      second: 1000
      minute: 30000
      limit_by: ip
      policy: local
      fault_tolerant: true
      hide_client_headers: false

###
### Dashboard credentials
###
basicauth_credentials:
  - consumer: DASHBOARD
    username: '$DASHBOARD_USERNAME'
    password: '$DASHBOARD_PASSWORD'

###
### API Routes
###
services:
  ## Open Auth routes
  # CraftLoop (decisao 286, 2026-10-15): o `/auth/v1/verify` saiu daqui e so aceita o service_role, no
  # `auth-v1-verify` abaixo. Quem confere o codigo de login e a API (`POST /auth/verify-otp`), que conta as
  # tentativas erradas por e-mail; com ele aberto, o limite dela se contornava chamando o GoTrue direto.
  - name: auth-v1-open-callback
    _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
    url: http://auth:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
    url: http://auth:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors
  - name: auth-v1-open-jwks
    _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
    url: http://auth:9999/.well-known/jwks.json
    routes:
      - name: auth-v1-open-jwks
        strip_path: true
        paths:
          - /auth/v1/.well-known/jwks.json
    plugins:
      - name: cors

  - name: auth-v1-open-sso-acs
    url: "http://auth:9999/sso/saml/acs"
    routes:
      - name: auth-v1-open-sso-acs
        strip_path: true
        paths:
        - /sso/saml/acs
    plugins:
      - name: cors
      
  - name: auth-v1-open-sso-metadata
    url: "http://auth:9999/sso/saml/metadata"
    routes:
      - name: auth-v1-open-sso-metadata
        strip_path: true
        paths:
        - /sso/saml/metadata
    plugins:
      - name: cors

  ## Auth routes that SEND E-MAIL: service_role only
  # CraftLoop (B4 da auditoria de BD e seguranca, 2026-10-15): com a chave anon, que vai no bundle dos
  # fronts, qualquer um chamava estas rotas direto pela `auth-v1` abaixo, pulando o portao da API
  # (`POST /auth/request-otp`: modulo, resposta generica e limites por e-mail e IP). O GoTrue nao limita
  # por IP aqui (sem `GOTRUE_RATE_LIMIT_HEADER`, de proposito), entao sobravam o teto GLOBAL de e-mail
  # (500/h, que um atacante esgota e barra o login de todos), 1 e-mail por minuto a cada pessoa, e o 422
  # do `/otp` para e-mail inexistente como oraculo de cadastro. Agora so o grupo `admin` (service_role)
  # passa; quem pede o codigo e a API, com o service_role no `apikey` e o anon no `Authorization`.
  # O request-transformer abaixo NAO troca esse Authorization: o 1o ramo do `$LUA_AUTH_EXPR`
  # (kong-entrypoint.sh) o mantem quando existe e nao comeca com `Bearer sb_`, entao o GoTrue ve anon.
  # O prefixo mais longo vence o `/auth/v1/` (router traditional_compatible), e o caminho e normalizado
  # antes do casamento (barras repetidas, `/./`, `%6F`). Um servico por rota, no molde do `auth-v1-open`:
  # o `strip_path` tira o caminho inteiro que casou. Sem `cors`: nenhum navegador chama estas rotas.
  - name: auth-v1-otp
    _comment: 'Auth: /auth/v1/otp* -> http://auth:9999/otp* (service_role only)'
    url: http://auth:9999/otp
    routes:
      - name: auth-v1-otp
        strip_path: true
        paths:
          - /auth/v1/otp
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
  - name: auth-v1-magiclink
    _comment: 'Auth: /auth/v1/magiclink* -> http://auth:9999/magiclink* (service_role only)'
    url: http://auth:9999/magiclink
    routes:
      - name: auth-v1-magiclink
        strip_path: true
        paths:
          - /auth/v1/magiclink
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
  - name: auth-v1-recover
    _comment: 'Auth: /auth/v1/recover* -> http://auth:9999/recover* (service_role only)'
    url: http://auth:9999/recover
    routes:
      - name: auth-v1-recover
        strip_path: true
        paths:
          - /auth/v1/recover
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
  - name: auth-v1-resend
    _comment: 'Auth: /auth/v1/resend* -> http://auth:9999/resend* (service_role only)'
    url: http://auth:9999/resend
    routes:
      - name: auth-v1-resend
        strip_path: true
        paths:
          - /auth/v1/resend
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
  # O `/verify` no mesmo molde (decisao 286). Os e-mails do CraftLoop so levam o codigo, e nenhum link aponta
  # para ca; a API o chama com o service_role no `apikey` e o anon no `Authorization`.
  - name: auth-v1-verify
    _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify* (service_role only)'
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-verify
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
  - name: auth-v1-signup
    _comment: 'Auth: /auth/v1/signup* -> http://auth:9999/signup* (service_role only)'
    url: http://auth:9999/signup
    routes:
      - name: auth-v1-signup
        strip_path: true
        paths:
          - /auth/v1/signup
    plugins:
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin

  ## Secure Auth routes
  - name: auth-v1
    _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure PostgREST routes
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      # CraftLoop (Fase 2 do rate limit): o balde do rate-limiting do rest e a SESSAO do token, e nao o token
      # cru (renovar o token nao abre balde novo). Roda antes de tudo (prioridade 1000000) e so prepara o
      # cabecalho que o rate-limiting (910) le. Sem verificar a assinatura: o segredo JWT nao entra no Kong,
      # e o token forjado ganha balde proprio, mas o PostgREST o recusa (401) antes do banco; a Fase 2 NAO
      # contem a inundacao anonima no rest. So as chaves de TOPO valem, por JSON de verdade: o
      # `user_metadata` e gravavel pela pessoa, e o `app_metadata` do hook tem um `role` proprio. Qualquer
      # falha deixa o cabecalho ausente, e o rate-limiting conta pelo IP; a falha de AMBIENTE (o sandbox recusar o
      # `require`, por exemplo, depois de um upgrade do Kong) vai ao log de erro. O cabecalho que o cliente mandar
      # e apagado antes. Exige `cjson.safe` no KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES. ⚠️ O kong-entrypoint.sh
      # troca todo cifrao seguido de letra pela env: o codigo abaixo so tem o cifrao antes de aspas.
      - name: pre-function
        config:
          access:
            - |
              local H = "X-CL-RL-Session"
              kong.service.request.clear_header(H)
              local x = "%x"
              local UUID = "^" .. x:rep(8) .. "%-" .. x:rep(4) .. "%-"
                .. x:rep(4) .. "%-" .. x:rep(4) .. "%-" .. x:rep(12) .. "$"
              local ok, sid = pcall(function()
                local auth = kong.request.get_header("authorization")
                if type(auth) ~= "string" or #auth > 4096 then return nil end
                local p = auth:match("^Bearer [%w%-_]+%.([%w%-_]+)%.[%w%-_]+$")
                if not p or #p > 3072 then return nil end
                p = p:gsub("%-", "+"):gsub("_", "/")
                p = p .. string.rep("=", (4 - #p % 4) % 4)
                local json = ngx.decode_base64(p)
                if type(json) ~= "string" then return nil end
                local t = require("cjson.safe").decode(json)
                if type(t) ~= "table" or t.role ~= "authenticated" then
                  return nil
                end
                local s = t.session_id
                if type(s) ~= "string" or not s:match(UUID) then return nil end
                return s
              end)
              if not ok then kong.log.err("cl-rl-session: ", sid) end
              if ok and sid then kong.service.request.set_header(H, sid) end
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
            - api_server

  ## Secure GraphQL routes
  - name: graphql-v1
    _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
    url: http://rest:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Content-Profile: graphql_public"
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure Realtime routes
  - name: realtime-v1-ws
    _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://realtime-dev:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "x-api-key:$LUA_RT_WS_EXPR"
          replace:
            querystring:
              - "apikey:$LUA_RT_WS_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: realtime-v1-rest
    _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
    url: http://realtime-dev:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Storage API endpoint (with Authorization header transformation).
  ## No key-auth — S3 protocol requests don't carry an apikey header.
  ##
  ## The request-transformer translates opaque API keys to asymmetric JWTs
  ## and passes through existing Authorization headers (user JWTs, AWS SigV4).
  ## When no Authorization or apikey header is present (S3 presigned URLs),
  ## the Lua expression evaluates to nil which Kong renders as empty string.
  ## The post-function strips this empty header so Storage's S3 signature
  ## verification falls through to query-parameter parsing.
  - name: storage-v1
    _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      # CORS restricted to the CraftLoop fronts (staging + production). Client
      # files must not be readable via cross-origin fetch from another site in a
      # logged-in user's browser. NOTE: this is defense in depth, not the primary
      # access control -- that is the signed URL (short TTL) plus the storage
      # policies, which already 403 any request without a valid token (curl,
      # direct navigation, etc.). methods/headers are left at the plugin default
      # (the preflight echoes the requested headers) so the storage-js
      # upload/download flow keeps working; only the allowed Origin is narrowed.
      - name: cors
        config:
          origins:
            - https://app.craftloop.app
            - https://admin.craftloop.app
            - https://staff.craftloop.app
            - https://teste.app.craftloop.app
            - https://teste.admin.craftloop.app
            - https://teste.staff.craftloop.app
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      # nosniff: prevent the browser from re-interpreting the Content-Type of an
      # object served from storage. Defense in depth over the app's upload-time
      # allowlist (app-craftloop migration 0097 + octet-stream for .svg/.fig).
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Content-Type-Options: nosniff"
      - name: post-function
        config:
          access:
            - |
              local auth = kong.request.get_header("authorization")
              if auth == nil or auth == "" or auth:find("^%s*$") then
                kong.service.request.clear_header("authorization")
              end

  ## Edge Functions routes
  - name: functions-v1
    _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
    url: http://functions:9000/
    read_timeout: 150000
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/
    plugins:
      - name: cors

  ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
  - name: well-known-oauth
    _comment: 'Auth: /.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
    url: http://auth:9999/.well-known/oauth-authorization-server
    routes:
      - name: well-known-oauth
        strip_path: true
        paths:
          - /.well-known/oauth-authorization-server
    plugins:
      - name: cors

